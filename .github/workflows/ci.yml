name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (with dev extras for pytest)
        # pytest + pytest-asyncio + ruff are in [project.optional-dependencies] dev
        # — uv sync needs --extra dev to install them. Without this the CI
        # step fails with "Failed to spawn: pytest" because the binary isn't
        # in the resolved environment.
        run: uv sync --frozen --extra dev

      - name: Pytest
        # tests/ has unit tests + integration/ subdir. The integration
        # tests touch external services (Anthropic, OpenAI); gate them
        # behind a marker so CI runs unit tests only by default.
        run: uv run pytest -q -m "not integration" tests/
