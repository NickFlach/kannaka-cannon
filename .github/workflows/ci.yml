name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (with dev extras for pytest)
        # pytest + pytest-asyncio + ruff are in [project.optional-dependencies] dev
        # — uv sync needs --extra dev to install them. Without this the CI
        # step fails with "Failed to spawn: pytest" because the binary isn't
        # in the resolved environment.
        run: uv sync --frozen --extra dev

      - name: Pytest
        # tests/ has unit tests + integration/ + ML-heavy paths
        # (voiceagent/, test_voice_inference.py) that need torch +
        # soundfile from the optional `ml`/`phase3` dependency groups.
        # Those would push CI install size past 2 GB just for torch
        # alone, so we skip them at collection time. Re-add when the
        # tests are split into a separate workflow or when uv adds
        # cheap CPU-only torch installs.
        run: |
          # test_voice_verify.py also pulls in src/clipcannon/voice/verify.py
          # which imports torch at module level — add to the ignore list.
          # test_captions.py is ML-free (sqlite/pydantic only) and now runs
          # in CI; its former failure was a stale product-name assertion.
          uv run pytest -q \
            --ignore=tests/voiceagent \
            --ignore=tests/test_voice_inference.py \
            --ignore=tests/test_voice_verify.py \
            --ignore=tests/integration \
            -m "not integration" \
            tests/
