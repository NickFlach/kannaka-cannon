name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Pytest
        # tests/ has unit tests + integration/ subdir. The integration
        # tests touch external services (Anthropic, OpenAI); gate them
        # behind a marker so CI runs unit tests only by default.
        run: uv run pytest -q -m "not integration" tests/
